services:
  - type: web
    name: ollama-optimizer
    env: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: ollama-cache
          property: connectionString
      - key: OLLAMA_BASE_URL
        value: https://emu-hardhead-unfold.ngrok-free.dev
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: ollama-optimizer-dashboard
    env: node
    plan: starter
    buildCommand: cd web && npm install && npm run build
    startCommand: cd web && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://ollama-optimizer-v2.onrender.com
      - key: NODE_VERSION
        value: 18

  - type: redis
    name: ollama-cache
    plan: starter
    ipAllowList: []
